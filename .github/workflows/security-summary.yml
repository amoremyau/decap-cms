name: Security Summary

on:
  # запускаем после Security Gateway
  workflow_run:
    workflows:
      - "Security Gateway"
    types:
      - completed
  # ручной запуск для отладки
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  security-events: read
  pull-requests: write
  issues: write

concurrency:
  group: security-summary-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  summarize:
    # идём дальше, только если gateway прошёл
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Build security summary and comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const sha =
              context.eventName === 'workflow_dispatch'
                ? context.sha
                : context.payload.workflow_run.head_sha;

            const required = [
              "SAST - CodeQL",
              "SAST - Semgrep",
              "Lint - ESLint",
              "Dependency Audit",
              "Secrets Scan - Gitleaks",
              "DAST - OWASP ZAP Baseline",
              "Lint - GitHub Actions",
              "CI - Build & Test",
              "Security Gateway"
            ];

            // 1) Статусы workflow
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              per_page: 100,
              head_sha: sha,
            });

            const latest = {};
            for (const r of data.workflow_runs) {
              if (!required.includes(r.name)) continue;
              if (!latest[r.name]) {
                latest[r.name] = r.conclusion ?? 'unknown';
              }
            }

            // 2) Подсчёт уязвимостей по Code Scanning
            const alerts = await github.paginate(
              github.rest.codeScanning.listAlertsForRepo,
              {
                owner,
                repo,
                ref: sha,
                per_page: 100,
                state: 'open',
              }
            );

            const counts = {
              critical: 0,
              high: 0,
              medium: 0,
              low: 0,
              other: 0,
            };

            for (const a of alerts) {
              const lvl = (a.rule?.security_severity_level || '').toLowerCase();
              if (lvl === 'critical') counts.critical++;
              else if (lvl === 'high') counts.high++;
              else if (lvl === 'medium') counts.medium++;
              else if (lvl === 'low') counts.low++;
              else counts.other++;
            }

            const rowsStatus = required
              .map(n => `| ${n} | ${latest[n] ?? '—'} |`)
              .join('\n');

            const rowsSeverity = [
              `| Critical | ${counts.critical} |`,
              `| High     | ${counts.high} |`,
              `| Medium   | ${counts.medium} |`,
              `| Low      | ${counts.low} |`,
              `| Other    | ${counts.other} |`,
            ].join('\n');

            const body = [
              '### Security Summary',
              '',
              `Commit: \`${sha.substring(0,7)}\``,
              '',
              '**Code scanning alerts by severity:**',
              '',
              '| Severity | Count |',
              '|---------|------:|',
              rowsSeverity,
              '',
              '**Workflow statuses:**',
              '',
              '| Проверка | Статус |',
              '|---------|--------|',
              rowsStatus,
            ].join('\n');

            // 3) Ищем PR
            let prNumber =
              context.payload.workflow_run?.pull_requests?.[0]?.number;

            if (!prNumber) {
              const prsBySha =
                await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: sha,
                });
              prNumber = prsBySha.data[0]?.number;
            }

            if (!prNumber) {
              const openPRs = await github.paginate(
                github.rest.pulls.list,
                {
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                }
              );
              const hit = openPRs.find(p => p.head?.sha === sha);
              prNumber = hit?.number;
            }

            if (prNumber) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              core.notice(`Security summary posted to PR #${prNumber}`);
            } else {
              core.warning('PR not found for this commit; printing summary to logs only.');
              console.log(body);
            }