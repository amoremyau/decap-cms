name: DAST - OWASP ZAP Baseline

on:
  pull_request:
  push:
    branches: [ "main", "master" ]

jobs:
  zap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1) Запускаем ZAP; результат сам по себе job не роняет —
      # решение принимает Security Gateway
      - name: ZAP Baseline scan (non-blocking)
        id: zap
        uses: zaproxy/action-baseline@v0.11.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # URL приложения на VPS. ZAP_TARGET_URL = http://176.124.213.11
          target: ${{ secrets.ZAP_TARGET_URL }}
          fail_action: false         # уязвимости не ломают job
          cmd_options: >
            -a                       # автоматический режим
            -m 0                     # не падать по уровням риска
            -J zap_report.json       # JSON-отчёт (удобно разбирать)
          allow_issue_writing: false
          artifact_name: zap_report

      # 2) Всегда прикладываем артефакты с отчётом
      - name: Upload ZAP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap_report_${{ github.run_id }}
          path: |
            zap_report.json
            zap.out
            **/*zap*.html
            **/*report*.html
          if-no-files-found: warn
